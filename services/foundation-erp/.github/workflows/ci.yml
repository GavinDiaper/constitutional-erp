name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: false  # Disabled - running tests manually during development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Migrate database
        run: npm run migrate

      - name: Start API
        run: PORT=3000 API_KEY=change-me INGRESS_ID_VALUE=foundation-ingress npm start &

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - name: Postman tests (Newman)
        env:
          POSTMAN_BASE_URL: http://localhost:3000
          POSTMAN_API_KEY: change-me
          POSTMAN_INGRESS_ID: foundation-ingress
        run: npm run test:postman

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/newman/
